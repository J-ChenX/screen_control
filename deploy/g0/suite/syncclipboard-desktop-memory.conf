# 覆盖已有 XDG 自启动服务，预算包含托管堆、图像与其他本机库。
[Service]
# 仅影响此 Linux 客户端：限制原生分配区域数量，让释放的大块内存更容易归还系统。
Environment=MALLOC_ARENA_MAX=2
Environment=MALLOC_TRIM_THRESHOLD_=131072
Environment=MALLOC_MMAP_THRESHOLD_=131072
MemoryAccounting=yes
MemoryHigh=640M
MemoryMax=768M
MemorySwapMax=128M
OOMPolicy=kill
Restart=on-failure
RestartSec=5
