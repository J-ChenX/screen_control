name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    name: 变更与文档检查
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.plan.outputs.go }}
      web: ${{ steps.plan.outputs.web }}
      native: ${{ steps.plan.outputs.native }}
      operations: ${{ steps.plan.outputs.operations }}
      compat: ${{ steps.plan.outputs.compat }}
      codeql: ${{ steps.plan.outputs.codeql }}
      codeql_matrix: ${{ steps.plan.outputs.codeql_matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.12.13
      - name: 选择检查范围并核对差异与文档链接
        id: plan
        env:
          CI_EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python ops/ci/plan.py
      - name: 检查范围选择的回归
        run: python -m unittest discover -s tests/operations -p 'test_ci_plan.py'

  native:
    needs: prepare
    if: needs.prepare.outputs.native == 'true'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --release --locked -p screen-control-protocol-ffi
      - if: runner.os == 'Linux'
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie -I native/protocol-ffi/include tests/native/websocket_abi.c target/release/libscreen_control_protocol_ffi.a -ldl -lpthread -lm -o /tmp/websocket-abi
          /tmp/websocket-abi

  go:
    needs: prepare
    if: needs.prepare.outputs.go == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.8
          cache-dependency-path: go.sum
      - run: go test ./...
      - run: go vet ./...
      - name: 检查 GitHub 工作流
        if: runner.os == 'Linux'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes= .github/workflows/ci.yml
      - if: runner.os == 'Linux'
        run: go test -race ./...
      - run: go build -trimpath ./cmd/screen-control ./cmd/screen-control-files

  go-compat:
    name: Go 兼容版本
    needs: prepare
    if: needs.prepare.outputs.compat == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.1
          cache-dependency-path: go.sum
      - run: go test ./...
      - run: go build -trimpath ./cmd/screen-control ./cmd/screen-control-files

  web:
    needs: prepare
    if: needs.prepare.outputs.web == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.20.0
          # pnpm 初始化前不启动依赖它的缓存步骤。
          package-manager-cache: false
      - run: corepack enable
      - run: corepack install --global pnpm@11.25.0
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web test
      # build 已包含 TypeScript 检查，不重复运行 tsc。
      - run: pnpm --dir web build
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: node tests/browser/run.mjs

  bootstrap-security:
    needs: prepare
    if: needs.prepare.outputs.operations == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.12.13
      - run: python -m unittest discover -s tests/operations -p 'test_*.py'
      - run: python ops/bootstrap/validate_toolchain.py
      - run: ./ops/verify/run suite bootstrap --dry-run
      - run: python deploy/spike/meshcentral/verify.py

  codeql:
    name: CodeQL ${{ matrix.language }}
    needs: prepare
    if: needs.prepare.outputs.codeql == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.codeql_matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - if: matrix.language == 'go'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.8
          cache-dependency-path: go.sum
      - name: 初始化扫描
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: 构建 Go 代码
        if: matrix.language == 'go'
        run: go build -trimpath ./...
      - name: 上传扫描结果
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:${{ matrix.language }}
